# NavlunIQ nginx site yapılandırması.
# deploy/install.sh bu dosyadaki __DOMAIN__ ve __PHP_SOCK__ alanlarını doldurup
# /etc/nginx/sites-available/navluniq olarak kopyalar.

# Alan adı dışındaki Host başlıklarıyla gelen istekler (IP ile tarama, sahte Host) cevapsız kapatılır.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root /var/www/navluniq/public;

    index index.php;
    charset utf-8;
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # HSTS: certbot https'e geçirdikten sonra tarayıcı bir yıl boyunca yalnız https kullanır (http üzerinden hiç istek gitmez).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/build/ {
        expires 1y;
        # Bu blokta add_header kullanıldığı için üstteki güvenlik başlıkları miras kalmaz; yeniden yazılır.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
