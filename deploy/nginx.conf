# NavlunIQ nginx site yapılandırması.
# deploy/install.sh bu dosyadaki __DOMAIN__ ve __PHP_SOCK__ alanlarını doldurup
# /etc/nginx/sites-available/navluniq olarak kopyalar.

# İkinci katman istek sınırı (I17): uygulamanın adlı sınırlayıcıları (AppServiceProvider) asıl kapıdır; nginx PHP'ye
# hiç ulaşmayan kaba bir koruma koyar. Giriş sayfası 120 istek/dk (anlık 60), telefon alım ucu uygulamadaki 600/dk ile
# aynı (anlık 100) — çok grubu olan telefon dakikada yüzlerce mesaj yollayabilir, nginx bunu kesmemeli.
limit_req_zone $binary_remote_addr zone=navluniq_login:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=navluniq_intake:10m rate=600r/m;
limit_req_status 429;

# Alan adı dışındaki Host başlıklarıyla gelen istekler (IP ile tarama, sahte Host) cevapsız kapatılır.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root /var/www/navluniq/public;

    index index.php;
    charset utf-8;
    client_max_body_size 32M;
    # Gövdeyi yavaş gönderen (ya da hiç göndermeyen) bağlantı işçiyi 30 sn'den fazla tutamaz.
    client_body_timeout 30s;
    # nginx sürümü hata sayfalarında ve Server başlığında yazmaz.
    server_tokens off;

    # Metin türleri sıkıştırılır (telefonda daha hızlı sayfa; resimler zaten sıkışık).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # HSTS: certbot https'e geçirdikten sonra tarayıcı bir yıl boyunca yalnız https kullanır (http üzerinden hiç istek gitmez).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Giriş sayfası: şifre deneme botlarına ikinci katman sınır.
    location = /giris {
        limit_req zone=navluniq_login burst=60 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Telefon alım uçları (mesaj, sınama, sürüm): kaynak başına kaba sınır; asıl sayaçlar uygulamada.
    location ^~ /api/v1/webhook/notification {
        limit_req zone=navluniq_intake burst=100 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/build/ {
        expires 1y;
        # Bu blokta add_header kullanıldığı için üstteki güvenlik başlıkları miras kalmaz; yeniden yazılır.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    # Yüklenen dosyalar arasında .php uzantılı bir şey olsa bile çalıştırılmaz (public/storage → storage/app/public).
    location ~ ^/storage/.*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
