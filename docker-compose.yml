# NavlunIQ'yu kendi bilgisayarınızda, canlı yedeğiyle çalıştırmak için (bkz. docs/YEREL_YEDEK_CALISTIRMA.md).
#   docker compose build
#   docker compose up -d mysql redis
#   docker compose run --rm app bash deploy/docker/yerel-geri-yukle.sh /yedek/navluniq-YYYYmmdd-HHMMSS.tar.gz
#   docker compose up -d
#   http://localhost:8080
services:
  app:
    build: deploy/docker
    volumes:
      - .:/var/www/navluniq
      - ./yedek:/yedek
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/navluniq:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # Zamanlanmış görevler ve kuyruk işçisi: canlıdaki cron + supervisor'ın karşılığı.
  scheduler:
    build: deploy/docker
    command: sh -c "while true; do php artisan schedule:run --no-interaction >/dev/null 2>&1; sleep 60; done"
    volumes:
      - .:/var/www/navluniq
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  worker:
    build: deploy/docker
    command: sh -c "sleep 15; php artisan queue:work database --sleep=3 --tries=3 --max-time=3600"
    volumes:
      - .:/var/www/navluniq
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: navluniq
      MYSQL_USER: navluniq
      MYSQL_PASSWORD: navluniq
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-flush-log-at-trx-commit=2 --skip-log-bin
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mysql-data:
