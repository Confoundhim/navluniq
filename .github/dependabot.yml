# Bağımlılık güncellemeleri (I11): ayda bir, tek PR'da gruplanmış (composer, npm, GitHub Actions). PR açılınca CI çalışır;
# Osman yeşil PR'ı birleştirir. Güvenlik güncellemeleri Dependabot tarafından takvim beklemeden açılır.
# Büyük sürüm atlamaları (major) kapalı: 2026-10-05'te Tailwind 3→4 ve Vite 5→8 önerisi birleştirilince derleme bozuldu, güncelleme
# önceki sürüme döndü. Büyük sürüm geçişi elle ve testle yapılır.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      composer-paketleri:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'Bağımlılık (composer)'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-paketleri:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'Bağımlılık (npm)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'Bağımlılık (actions)'
